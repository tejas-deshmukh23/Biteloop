server:
  port: 8086

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/tiffin_payments}
    username: ${SPRING_DATASOURCE_USERNAME:tiffin}
    password: ${SPRING_DATASOURCE_PASSWORD:tiffin123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
#  Key-id: rzp_test_T3SFSVJ1juDQSe
  key-secret: ${RAZORPAY_KEY_SECRET}
#  key-secret: c50965uoG7AZeD6wGuTfMzi1
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
#  webhook-secret: rzp_test_T3SFSVJ1juDQSe

# Internal service URLs
services:
  order-service:
    url: ${ORDER_SERVICE_URL:http://order-service:8084}

logging:
  level:
    root: INFO
    com.tiffin: DEBUG