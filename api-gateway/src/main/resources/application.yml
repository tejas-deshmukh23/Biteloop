server:
  port: 8080

spring:
  application:
    name: api-gateway

  # Gateway is reactive — exclude servlet-based kafka autoconfigure
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: ["GET","POST","PUT","DELETE","PATCH","OPTIONS"]
            allowedHeaders: "*"

      routes:

        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
          filters:
            - AuthFilter

        - id: provider-service
          uri: http://provider-service:8082
          predicates:
            - Path=/api/providers/**
          filters:
            - AuthFilter

        - id: menu-service
          uri: http://menu-service:8083
          predicates:
            - Path=/api/menu/**        # ← fixed: was /api/menus/** but controller uses /api/menu
          filters:
            - AuthFilter

        - id: order-service
          uri: http://order-service:8084
          predicates:
            - Path=/api/orders/**
          filters:
            - AuthFilter

        - id: subscription-service
          uri: http://subscription-service:8085
          predicates:
            - Path=/api/subscriptions/**
          filters:
            - AuthFilter

        - id: payment-service
          uri: http://payment-service:8086
          predicates:
            - Path=/api/payments/**
          filters:
            - AuthFilter

        - id: admin-service
          uri: http://admin-service:8087
          predicates:
            - Path=/api/admin/**
          filters:
            - AuthFilter

jwt:
  secret: ${JWT_SECRET:local-dev-secret-minimum-32-characters-long!!}
  expiration: ${JWT_EXPIRATION:86400000}

# Public endpoints — AuthFilter skips JWT validation for these
public-endpoints:
  - /api/users/register
  - /api/users/login
  - /api/menu/**              # ← fixed: was /api/menus/**

logging:
  level:
    root: INFO
    com.tiffin: DEBUG
    org.springframework.cloud.gateway: DEBUG   # ← added: shows routing decisions