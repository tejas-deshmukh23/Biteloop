version: '3.8'

# ─────────────────────────────────────────────────────────────
# Tiffin Platform — Local Development Stack
# Run: docker-compose up -d
# All secrets come from .env file — never hardcoded here
# ─────────────────────────────────────────────────────────────

services:

  # ── Infrastructure ────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tiffin-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tiffin-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tiffin-kafka-ui
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: biteloop-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  redis:
    image: redis:7.2-alpine
    container_name: tiffin-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: tiffin-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql

  # ── Application Services ──────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: tiffin-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: tiffin-user-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - kafka
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tiffin_users
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}

  provider-service:
    build:
      context: .
      dockerfile: provider-service/Dockerfile
    container_name: tiffin-provider-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - kafka
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tiffin_providers
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8081

  menu-service:
    build:
      context: .
      dockerfile: menu-service/Dockerfile
    container_name: tiffin-menu-service
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tiffin_menus
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: tiffin-order-service
    ports:
      - "8084:8084"
    depends_on:
      - postgres
      - kafka
      - redis
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tiffin_orders
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}

  subscription-service:
    build:
      context: .
      dockerfile: subscription-service/Dockerfile
    container_name: tiffin-subscription-service
    ports:
      - "8085:8085"
    depends_on:
      - postgres
      - kafka
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tiffin_subscriptions
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: tiffin-payment-service
    ports:
      - "8086:8086"
    depends_on:
      - postgres
      - kafka
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tiffin_payments
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      #RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      #RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      #RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      key-id: ${RAZORPAY_KEY_ID}
      key-secret: ${RAZORPAY_KEY_SECRET}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      ORDER_SERVICE_URL: http://order-service:8084  # ← add this

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    container_name: tiffin-admin-service
    ports:
      - "8087:8087"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tiffin_admin
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: tiffin-notification-service
    depends_on:
      - kafka
      - postgres
    env_file:
      - .env
    environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tiffin_notifications
        SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
        SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
        SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        MAIL_USERNAME: ${MAIL_USERNAME}
        MAIL_PASSWORD: ${MAIL_PASSWORD}
        ADMIN_EMAIL: ${ADMIN_EMAIL}

volumes:
  postgres-data: